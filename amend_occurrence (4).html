{% extends 'base.html' %}{% block content %}<div class="card"><h1>Amend / Correct OB {{'%04d'|format(o.ob_number)}}</h1><div class="notice">Every amendment creates a new version and requires a reason. The previous record remains in the version history.</div><form method="post"><div class="grid"><div><label>Date</label><input type="date" name="occurrence_date" value="{{o.occurrence_date}}" required></div><div><label>Time</label><input type="time" name="occurrence_time" value="{{o.occurrence_time}}" required></div></div><label>Category</label><select name="category">{% for c in categories %}<option {% if o.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select><label>Location</label><input name="location" value="{{o.location}}" required><div class="grid"><div><label>Reporting person</label><input name="reporter_name" value="{{o.reporter_name}}" required></div><div><label>Identification type</label><select name="identification_type"><option value="">Not provided</option><option value="Kenyan National ID" {% if o.identification_type=='Kenyan National ID' %}selected{% endif %}>Kenyan National ID</option><option value="Passport" {% if o.identification_type=='Passport' %}selected{% endif %}>Passport</option><option value="Other" {% if o.identification_type=='Other' %}selected{% endif %}>Other</option></select></div></div><label>National ID / Passport number</label><input name="identification_reference" value="{{o.identification_reference or ''}}" autocomplete="off"><label>Narrative</label><textarea name="narrative" rows="8" required>{{o.narrative}}</textarea><label>Action taken</label><textarea name="action_taken" rows="4">{{o.action_taken or ''}}</textarea><label>Status</label><select name="status">{% for s in statuses %}<option {% if o.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><label>Reason for amendment <span class="required">*</span></label><textarea name="reason" rows="3" required>{{reason}}</textarea><button>Save Amendment</button> <a class="btn secondary" href="{{url_for('occurrence',oid=o.id)}}">Cancel</a></form></div>{% endblock %}
