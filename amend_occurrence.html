<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amend OB</title>
<style>body{margin:0;background:#f4f6f8;font:14px Arial;color:#18242d}.wrap{max-width:850px;margin:auto;padding:30px}.card{background:#fff;border:1px solid #d8e0e6;border-radius:10px;padding:22px}label{display:block;font-weight:bold;margin:14px 0 6px}textarea,input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5dc;border-radius:6px}.btn{margin-top:18px;padding:11px 16px;border:0;border-radius:6px;background:#1d5d85;color:#fff}.notice{background:#fff7e5;padding:12px;border:1px solid #efd59a;border-radius:6px}</style></head>
<body><div class="wrap"><div class="card"><h1>Amend OB 0247</h1><div class="notice"><b>Important:</b> This does not erase the original entry. A new version will be created and the reason for the amendment will be permanently recorded in the audit history.</div>
<label>Field being amended</label><input placeholder="e.g. Narrative / location / action taken">
<label>Corrected information</label><textarea rows="8"></textarea>
<label>Reason for amendment <span style="color:#a32626">*</span></label><textarea rows="4" placeholder="Explain why the amendment is required"></textarea>
<button class="btn">Submit Amendment</button></div></div></body></html>
